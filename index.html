<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="device--photo" aria-label="Phone mockup">
        <img
          class="device__screen"
          src="./assets/screen-content.png"
          alt="Phone screen content"
          width="364"
          height="750"
        />
        <img
          class="device__frame"
          src="./assets/device-frame.png"
          alt="Phone frame"
          width="364"
          height="750"
        />
      </div>
    </main>
  </body>
</html>
